<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Journal Book cover outline / spine -->
  <rect x="96" y="96" width="320" height="320" rx="20" fill="#ffffff" />
  <rect x="96" y="96" width="40" height="320" rx="10" fill="#cbd5e1" />

  <!-- Document / Analytics Chart inside journal -->
  <!-- Horizontal ruled lines representing journal entry text -->
  <rect x="160" y="140" width="220" height="12" rx="6" fill="#e2e8f0" />
  <rect x="160" y="168" width="160" height="12" rx="6" fill="#e2e8f0" />

  <!-- Bar chart representing structured analytics -->
  <rect x="160" y="310" width="30" height="60" rx="6" fill="url(#barGrad)" />
  <rect x="205" y="260" width="30" height="110" rx="6" fill="url(#barGrad)" />
  <rect x="250" y="220" width="30" height="150" rx="6" fill="url(#barGrad)" />
  <rect x="295" y="275" width="30" height="95" rx="6" fill="url(#barGrad)" />
  <rect x="340" y="240" width="30" height="130" rx="6" fill="url(#barGrad)" />

  <!-- Baseline for chart -->
  <rect x="150" y="372" width="230" height="6" rx="3" fill="#94a3b8" />
</svg>
